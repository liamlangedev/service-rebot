/**:
  ros__parameters:
    arm_namespace: rebotarm
    frame_id: base_link
    ee_frame_id: end_link

    # Camera topics
    table_camera_topic: /table_cam/image_raw
    wrist_camera_topic: /wrist_cam/image_raw

    # Workspace heights in base_link [m]
    z_table: 0.02
    z_hover_offset: 0.14
    z_pick_offset: 0.012
    z_safe: 0.28

    # reBot Arm B601-DM gripper configuration ("soft" or "hard")
    gripper: soft
    gripper_open_rad: -5.0
    gripper_closed_rad: 0.0
    gripper_step_rad: 0.25
    gripper_effort_threshold: 1.5
