# Measured cell geometry, in base_link, from simulation/rebot_sim/real_setup.json
# (the sim is gone; these numbers came from measuring the real table, walls and bin).
#
# Boxes are [x_min, x_max, y_min, y_max, z_min, z_max] in metres. They are published
# as collision objects so MoveIt does not plan the arm into the walls or the bin.

table:
  z: 0.000                      # table surface height in base_link
  box: [-0.125, 1.215, -0.530, 0.750, -0.040, 0.000]

walls:
  near: [-0.081, -0.075, -0.380, 0.600, 0.000, 0.370]
  right: [-0.081, 0.765, -0.386, -0.380, 0.000, 0.370]
  left: [-0.081, 0.765, 0.600, 0.606, 0.000, 0.370]

bin:
  rim_z: 0.120
  floor_z: 0.000
  #: two compartments, separated by a divider; x/y is the release point
  compartments:
    bin_0: {x: 0.1812, y: 0.4750}     # near compartment: reachable, use by default
    bin_1: {x: 0.3687, y: 0.4750}     # far compartment: only reachable with a hard lean
  boxes:
    floor: [0.075, 0.475, 0.350, 0.600, 0.000, 0.020]
    wall_left: [0.075, 0.475, 0.575, 0.600, 0.020, 0.120]
    wall_right: [0.075, 0.475, 0.350, 0.375, 0.020, 0.120]
    wall_near: [0.075, 0.100, 0.375, 0.575, 0.020, 0.120]
    wall_far: [0.450, 0.475, 0.375, 0.575, 0.020, 0.120]
    divider: [0.262, 0.287, 0.375, 0.575, 0.020, 0.120]

# There is deliberately no per-class size table here. The detector is
# open-vocabulary, so any class list would be both wrong and incomplete. Object
# width and orientation are measured from the mask's bottom edge through the table
# homography, and grasp height is a generic ladder in motion.yaml.

#: where the arm may put an object when the task names no destination
workspace:
  x: [0.16, 0.34]
  y: [-0.26, 0.26]
