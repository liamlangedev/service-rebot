# Measured table plane and bin destinations, in base_link metres.

table:
  z: 0.000                      # table surface height in base_link

bin:
  rim_z: 0.120
  floor_z: 0.000
  #: two compartments, separated by a divider; x/y is the release point
  compartments:
    bin_0: {x: 0.1812, y: 0.4750}     # near compartment: reachable, use by default
    bin_1: {x: 0.3687, y: 0.4750}     # far compartment: only reachable with a hard lean

# There is deliberately no per-class size table here. The detector is
# open-vocabulary, so any class list would be both wrong and incomplete. Object
# width and orientation are measured from the mask's bottom edge through the table
# homography, and grasp height is a generic ladder in motion.yaml.

#: where the arm may put an object when the task names no destination
workspace:
  x: [0.16, 0.34]
  y: [-0.26, 0.26]
