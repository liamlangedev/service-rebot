# Learned grasp node (grasp_policy_node). See training_gripper/README.md.
grasp_policy:
  ros__parameters:
    # Hub repo id or a local `pretrained_model` dir. The launch file can override it.
    #   relative (variant B): niru-5/act_rebot_grasp_keys_rel, mode relative, cameras [gripper]
    #   absolute (variant A): niru-5/act_rebot_grasp_keys_abs, mode absolute, 3 cameras
    #   full-task baseline:   niru-5/act_rebot_sort_v1,        mode absolute, 3 cameras
    policy_path: niru-5/act_rebot_grasp_keys_rel
    policy_revision: ""
    mode: relative                 # relative | absolute (must match how it was trained)
    device: cpu                    # cuda if available
    n_steps: 10                    # actions executed per inference (1/3 s at 30 Hz)
    task: grasp the keys and lift them
    max_offset_deg: 45.0           # arm joints stay within this of the handoff pose
    rate_hz: 30.0                  # dataset fps
    timeout_s: 8.0

    arm_action: /rebotarm_controller/follow_joint_trajectory
    gripper_action: /gripper_controller/follow_joint_trajectory
    gripper_joint: finger_left
    # gripper opening map: ROS finger_left metres <-> dataset gripper degrees
    gripper_ros_open_m: 0.05
    gripper_ros_closed_m: 0.0
    gripper_data_open_deg: -365.0
    gripper_data_closed_deg: -5.0

    # policy camera name (dataset key suffix) -> ROS image topic, same order.
    # Dataset cameras: gripper (wrist), front_wide, high_oblique.
    camera_names: [gripper]
    camera_topics: [/wrist_cam/image_raw]

    # "gripped and lifted": jaw commanded closed and settled, then TCP up by lift_m
    base_frame: base_link
    tcp_frame: gripper_tcp
    lift_m: 0.05
    done_closed_ticks: 6
    done_settle_ticks: 6
    done_settle_m: 0.0008
    stale_s: 0.5
    load_on_start: true
