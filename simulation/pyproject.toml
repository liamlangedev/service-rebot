[project]
name = "rebot-sim"
version = "1.1.0"
description = "MuJoCo model of the steel_team reBot B601 real workspace (table, walls, bin, cameras, objects)"
requires-python = ">=3.12"
# Builds on the teleop reBot model in ../teleoperation (found by repo-relative
# path), so install it editable from this repo, e.g. via teleoperation's uv env.
dependencies = ["mujoco>=3.2", "numpy", "pillow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rebot_sim"]
